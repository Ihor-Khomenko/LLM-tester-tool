# Оберіг (Oberih) default policy (research MVP; formerly MCP-Sentinel).
# Thresholds/weights unchanged — rename only.
# Thresholds are starting points for offline calibration — not published results.

tau_low: 0.25
tau_high: 0.70
risk_aggregation: noisy_or

enable_s1: true
enable_s2: true
enable_s3: true
enable_s4: false

weight_s1: 0.35
weight_s2: 0.45
weight_s3: 0.20

s1_block_threshold: 0.85
block_destructive_tools: true
block_sensitive_paths: true
sensitive_path_score: 0.9

s2_block_threshold: 0.55
sensitive_arg_weight: 1.5
default_arg_weight: 0.35
taint_ngram_n: 3
# Generic verbs / name segments — not fixture-specific tool ids.
side_effect_verbs:
  - write
  - create
  - update
  - delete
  - remove
  - rm
  - send
  - email
  - transfer
  - wire
  - pay
  - post
  - put
  - upload
  - download
  - fetch
  - http
  - exec
  - execute
  - shell
  - run
  - command
  - grant
  - revoke
  - chmod
  - move
  - rename
  - copy

s3_block_threshold: 0.65
s3_min_similarity: 0.25
s3_backend: lite

# S4 judge: auto-detect llama-guard* models; ambiguous → defer to prior cascade.
s4_judge_family: auto
s4_ambiguous_policy: defer

ask_user_on_block: false
high_risk_action: block
# Opt-in decision-policy experiment (default preserves historical hard-block).
soft_s3_allow_without_s4: false

# Graded action A/B (default ``block``). ``graded`` quarantines harmless
# local file writes instead of hard-blocking; exfil/secret writes stay blocked.
# Defense arm: ``oberih_graded`` / ``--defense oberih_graded``.
response_mode: block
quarantine_dir: /tmp/oberih-quarantine

t0_semantic_diff_threshold: 0.35
t0_block_on_hash_mismatch: true

log_path: null
