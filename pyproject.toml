[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tester"
version = "0.1.0"
description = "Research tool for testing LLM refusal behaviour on harmful prompts (jailbreak / prompt injection)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PhD research" }]
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
guard = ["llm-guard"]
dev = ["pytest>=7.0"]
all = ["llm-guard", "pytest>=7.0"]

[project.scripts]
llmtest = "llm_tester.cli:main"

[tool.setuptools.packages.find]
include = ["llm_tester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
